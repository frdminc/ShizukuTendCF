name: Crowdin Sync

# Manual-only until the repo has CROWDIN_PROJECT_ID and CROWDIN_TOKEN secrets:
# without them every triggered run fails (removed push/schedule triggers 2026-10-03).
on:
  workflow_dispatch:
    inputs:
      direction:
        description: 'upload (push sources to Crowdin) or download (pull translations)'
        required: true
        default: 'upload'
        type: choice
        options: [upload, download]

# Required secrets:
#   CROWDIN_PROJECT_ID   — numeric project ID from Crowdin project settings
#   CROWDIN_TOKEN        — Crowdin personal API token with project scope

jobs:
  upload-sources:
    name: Upload source strings to Crowdin
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'upload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload sources
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          download_translations: false
          crowdin_branch_name: master
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}

  download-translations:
    name: Download translations from Crowdin → open PR
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'download')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download approved translations
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          download_translations: true
          create_pull_request: true
          pull_request_title: 'chore(i18n): sync translations from Crowdin'
          pull_request_body: |
            Automated translation sync from Crowdin.

            Includes all strings approved by translation reviewers since the last sync.
            Please review for any unexpected changes before merging.
          pull_request_labels: 'type: enhancement'
          localization_branch_name: crowdin-translations
          crowdin_branch_name: master
          skip_untranslated_strings: false
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
