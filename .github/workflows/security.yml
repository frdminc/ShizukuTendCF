name: Secret Scanning

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

# TODO: restore the Gitleaks job (gitleaks/gitleaks-action@v2) once the org has a
# GITLEAKS_LICENSE secret; without it the job fails on every push (removed 2026-10-03).
jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
