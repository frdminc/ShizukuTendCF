name: Secret Scanning

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# TODO: restore the Gitleaks job (gitleaks/gitleaks-action@v2) once the org has a
# GITLEAKS_LICENSE secret; without it the job fails on every push (removed 2026-10-03).
jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          extra_args: --debug --only-verified
