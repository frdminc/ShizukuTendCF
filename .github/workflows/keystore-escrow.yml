# One-time: copy the release signing secrets into the operator's 1Password "Service" vault, so
# release-signed builds can be made locally (Actions secrets cannot be read back). Run once by
# hand, verify the item locally, then delete this file and the OP_SERVICE_ACCOUNT_TOKEN secret.
name: Keystore escrow (one-time)

on:
  workflow_dispatch:

permissions: {}

jobs:
  escrow:
    runs-on: ubuntu-latest
    steps:
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Write the signing secrets to 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
          VAULT: uo2uexgtc6rsapjs4hk4dpx2ky
        run: |
          set -euo pipefail
          umask 077
          # Secrets travel through env and a private temp file, never argv or the log.
          template="$RUNNER_TEMP/item.json"
          trap 'rm -f "$template"' EXIT
          jq -n \
            --arg ks "$KEYSTORE" --arg kp "$KEYSTORE_PASSWORD" \
            --arg ka "$KEYSTORE_ALIAS" --arg kap "$KEYSTORE_ALIAS_PASSWORD" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{title: "ShizukuTendCF release signing", category: "SECURE_NOTE",
              fields: [
                {id: "notesPlain", type: "STRING", purpose: "NOTES",
                 value: ("Release signing for frdminc/ShizukuTendCF, copied from its Actions secrets by " + $run + ". KEYSTORE is the base64 of key.jks, as app.yml decodes it.")},
                {label: "KEYSTORE", type: "CONCEALED", value: $ks},
                {label: "KEYSTORE_PASSWORD", type: "CONCEALED", value: $kp},
                {label: "KEYSTORE_ALIAS", type: "STRING", value: $ka},
                {label: "KEYSTORE_ALIAS_PASSWORD", type: "CONCEALED", value: $kap}
              ]}' > "$template"
          # A runner's stdin is a pipe, which op treats as a second template ("cannot create an
          # item from template and stdin at the same time"); /dev/null is not a pipe.
          op item create --vault "$VAULT" --template "$template" --format json < /dev/null | jq -r '"created item " + .id + " (" + .title + ", " + (.fields | length | tostring) + " fields)"'
          # A digest is not secret; it lets the local copy be checked against this one.
          printf '%s' "$KEYSTORE" | base64 --decode | sha256sum | awk '{print "key.jks sha256 " $1}'
