import java.util.regex.Matcher
import java.util.regex.Pattern
import javax.xml.parsers.DocumentBuilderFactory

// Fork-only. Rebrands user-visible strings at build time through a generated
// resource overlay, so the upstream strings.xml files (and their translations)
// stay byte-identical and rebasing on ShizukuPlus does not conflict on them.

// Drop-In keeps "Shizuku" as its launcher name (app_name resValue) for drop-in
// compatibility; only its in-app text names the fork.
def tendcfBrandedFlavors = ["shizukuplus", "dropin"]

// translation_url points at upstream's repo.
def tendcfKeptStrings = ["translation_url"]

// A bare "Shizuku" names this app too, except in these strings, where every bare "Shizuku" means
// the original project or the API and permission that third-party apps target. Kept by name so
// the exception holds in every locale; "Shizuku+" in them is still renamed. The reasons are in
// docs/SHIZUKUPLUS-REBASE-PLAN.md ("User-visible naming"); a string not listed here is renamed.
def tendcfBareKeptStrings = [
    // The original project, stock Shizuku, and the legacy/modern API generations.
    "home_root_description",
    "onboarding_welcome_desc",
    "help_general_plus_summary",
    "stock_shizuku_conflict_description",
    "stock_shizuku_conflict_dialog_message",
    "dialog_legacy_not_support_title",
    "dialog_legacy_not_support_message",
    "dialog_requesting_legacy_title",
    "settings_main_nav_root_compat_summary",
    "settings_root_category_stock_compat",
    "settings_shadow_binder_hidden_packages_summary",
    "settings_companion_mode_summary",
    "settings_companion_fallback_summary",
    "home_companion_title",
    "home_companion_description",
    "home_companion_not_installed",
    "watchdog_open_stock_shizuku",
    "settings_stealth_mode_summary",
    "help_stealth_mode_detail",
    "companion_conflict_title",
    "companion_conflict_description",
    "companion_disable_success",
    "companion_disable_failure",
    "compat_hub_missing_desc",
    "compat_hub_install_signature_conflict",
    // The Shizuku API and the "Shizuku permission" client apps request.
    "home_learn_more_description",
    "su_bridge_description",
    "settings_enable_activity_log_summary",
    "empty_state_description_activity_log_empty",
    "home_app_management_empty",
    "empty_state_description_no_apps",
    "settings_lp_toggle_permission",
    "accessibility_action_grant_permission",
    "accessibility_action_revoke_permission",
    // The API permission's system labels and the legacy-request dialog name the API other apps
    // target, so they keep "Shizuku" (decided 2026-10-05).
    "permission_group_label",
    "permission_label",
    "permission_description",
    "permission_group_label_plus",
    "permission_label_plus",
    "permission_description_plus",
    "dialog_requesting_legacy_message",
]

// Untranslatable strings replaced outright (default locale only).
def tendcfOverrides = [support_email: "djbclark@gmail.com"]

abstract class TendcfBrandingTask extends DefaultTask {
    // Comments are matched so that commented-out elements are skipped, not copied.
    private static final Pattern ELEMENT = ~/(?s)<!--.*?-->|<(string|string-array|plurals)\b([^>]*)>(.*?)<\/\1>/
    private static final Pattern NAME = ~/\bname\s*=\s*"([^"]*)"/
    private static final Pattern NAMESPACE = ~/\bxmlns:\w+\s*=\s*"[^"]*"/
    private static final Pattern URL = ~/[A-Za-z][A-Za-z0-9+.-]*:\/\/[^\s<>"']+/
    // The app is renamed; the API third-party apps target is not (package
    // af.shizuku.plus.api, class ShizukuPlusAPI), so "Shizuku+ API" and
    // "Shizuku+ Enhanced API" keep upstream's name.
    private static final Pattern OLD_NAME = ~/Shizuku\+(?! (?:Enhanced )?API)|ShizukuPlus(?![A-Za-z0-9_])/
    // Lookarounds rather than \b: a translation may run a letter straight on ("Shizukuを"), and
    // a dotted identifier (rikka.shizuku.Shizuku) is not a name.
    private static final Pattern BARE_NAME = ~/(?<![A-Za-z0-9_.])Shizuku(?![A-Za-z0-9_+])/

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getSourceFiles()

    @Input
    abstract SetProperty<String> getKeptStrings()

    @Input
    abstract SetProperty<String> getBareKeptStrings()

    @Input
    abstract Property<String> getNewName()

    @Input
    abstract MapProperty<String, String> getOverrides()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def out = outputDir.get().asFile
        out.deleteDir()

        def byQualifier = new TreeMap<String, List<File>>()
        sourceFiles.files.each { byQualifier.computeIfAbsent(it.parentFile.name) { [] } << it }

        def kept = keptStrings.get()
        def bareKept = bareKeptStrings.get()
        def replacement = Matcher.quoteReplacement(newName.get())
        byQualifier.each { qualifier, files ->
            def namespaces = new LinkedHashSet<String>()
            def elements = []
            files.sort { it.name }.each { file ->
                def text = file.getText("UTF-8")
                def root = text =~ /<resources\b[^>]*>/
                if (root.find()) {
                    def ns = root.group() =~ NAMESPACE
                    while (ns.find()) namespaces << ns.group()
                }
                def m = text =~ ELEMENT
                while (m.find()) {
                    if (m.group(1) == null) continue
                    def name = m.group(2) =~ NAME
                    def stringName = name.find() ? name.group(1) : null
                    if (stringName in kept) continue
                    def body = rebrand(m.group(3), replacement, !(stringName in bareKept))
                    if (body != m.group(3)) {
                        elements << "<${m.group(1)}${m.group(2)}>${body}</${m.group(1)}>"
                    }
                }
            }
            if (qualifier == "values") {
                overrides.get().each { name, value ->
                    elements << "<string name=\"${name}\" translatable=\"false\">${value}</string>"
                }
            }
            if (elements.isEmpty()) return

            def dest = new File(out, "${qualifier}/strings_tendcf.xml")
            dest.parentFile.mkdirs()
            def rootTag = namespaces ? "<resources ${namespaces.join(' ')}>" : "<resources>"
            dest.setText("""<?xml version="1.0" encoding="utf-8"?>
<!-- Generated by manager/tendcf-branding.gradle. Do not edit. -->
${rootTag}
${elements.collect { "    ${it}" }.join("\n")}
</resources>
""", "UTF-8")
            // Fails here, naming the file, rather than later inside resource merging.
            DocumentBuilderFactory.newInstance().newDocumentBuilder().parse(dest)
            logger.info("tendcf-branding: ${elements.size()} strings in ${qualifier}")
        }
    }

    // A URL keeps its old spelling, so links to upstream keep resolving.
    static String rebrand(String body, String replacement, boolean bare) {
        def result = new StringBuilder()
        def url = body =~ URL
        int last = 0
        while (url.find()) {
            result << rebrandText(body.substring(last, url.start()), replacement, bare)
            result << url.group()
            last = url.end()
        }
        result << rebrandText(body.substring(last), replacement, bare)
        return result.toString()
    }

    // OLD_NAME first: its result, "ShizukuTendCF", is not a bare "Shizuku".
    private static String rebrandText(String text, String replacement, boolean bare) {
        def renamed = (text =~ OLD_NAME).replaceAll(replacement)
        return bare ? (renamed =~ BARE_NAME).replaceAll(replacement) : renamed
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        if (!variant.productFlavors.any { it.second in tendcfBrandedFlavors }) return
        def task = tasks.register("generate${variant.name.capitalize()}TendcfBrandingRes", TendcfBrandingTask) {
            sourceFiles.from(fileTree("src/main/res") {
                include "values*/strings.xml", "values*/strings_companion.xml", "values*/strings_fork.xml"
            })
            keptStrings.addAll(tendcfKeptStrings)
            bareKeptStrings.addAll(tendcfBareKeptStrings)
            newName.set("ShizukuTendCF")
            overrides.putAll(tendcfOverrides)
        }
        // AGP places the output under build/generated/ and makes merge<Variant>Resources depend on it.
        variant.sources.res?.addGeneratedSourceDirectory(task) { it.outputDir }
    }
}
